let products = [];
let cart = JSON.parse(localStorage.getItem('babaCart') || '[]');
let activeCategory = 'all';
let language = 'en';
let currentAdmin = null;

const money = amount =>
  new Intl.NumberFormat('en-RW').format(Number(amount || 0)) + ' RWF';

const escapeHTML = value =>
  String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));

function categoryImage(category) {
  return categories.find(c => c.id === category)?.image || '';
}

function buildCategories() {
  const grid = document.getElementById('categoryGrid');
  const filter = document.getElementById('categoryFilter');
  const adminFilter = document.getElementById('productCategory');

  grid.innerHTML = '';
  filter.innerHTML = '<option value="all">All Categories</option>';
  adminFilter.innerHTML = '';

  categories.forEach(c => {
    const name = language === 'rw' ? c.rw : c.id;

    const card = document.createElement('div');
    card.className = 'category' +
      (activeCategory === c.id ? ' active' : '');

    card.innerHTML = `
      <img class="category-image"
           src="${c.image}"
           alt="${escapeHTML(name)}"
           loading="lazy">
      <strong>${escapeHTML(name)}</strong>
    `;

    card.addEventListener('click', () => {
      activeCategory = activeCategory === c.id ? 'all' : c.id;
      filter.value = activeCategory;
      buildCategories();
      renderProducts();
      document.getElementById('shop').scrollIntoView({behavior:'smooth'});
    });

    grid.appendChild(card);

    const option = document.createElement('option');
    option.value = c.id;
    option.textContent = c.id;
    filter.appendChild(option);

    const adminOption = document.createElement('option');
    adminOption.value = c.id;
    adminOption.textContent = c.id;
    adminFilter.appendChild(adminOption);
  });

  filter.value = activeCategory;
}

async function loadProducts() {
  const loading = document.getElementById('loadingMessage');
  loading.style.display = 'block';
  loading.textContent = 'Loading products...';

  const {data,error} = await supabase
    .from('products')
    .select('id,name,category,description,price,image_url,stock,created_at')
    .order('created_at',{ascending:false});

  if (error) {
    console.error('Product loading error:',error);
    loading.textContent =
      'We could not load products. Please refresh the page or contact the shop.';
    return false;
  }

  products = data || [];
  renderProducts();

  if (currentAdmin) renderAdminProducts();

  return true;
}

function renderProducts() {
  const grid = document.getElementById('productGrid');
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const selected = document.getElementById('categoryFilter').value;
  const category = selected === 'all' ? activeCategory : selected;

  const filtered = products.filter(p => {
    const matchesCategory = category === 'all' || p.category === category;
    const matchesSearch = [
      p.name,p.category,p.description
    ].join(' ').toLowerCase().includes(search);

    return matchesCategory && matchesSearch;
  });

  grid.innerHTML = '';
  document.getElementById('loadingMessage').style.display = 'none';

  if (!filtered.length) {
    grid.innerHTML = `
      <div class="empty">
        ${products.length
          ? 'No matching products found.'
          : 'Our product catalogue is being prepared. Please check again soon.'}
      </div>`;
    return;
  }

  filtered.forEach(p => {
    const card = document.createElement('article');
    card.className = 'product';

    card.innerHTML = `
      <div class="product-image"></div>
      <div class="product-info">
        <h3>${escapeHTML(p.name)}</h3>
        <p>${escapeHTML(p.category || 'Building materials')}</p>
        <p>${escapeHTML(p.description || '')}</p>
        <div class="price">${money(p.price)}</div>
        <div class="${Number(p.stock)>0?'stock':'stock out-stock'}">
          ${Number(p.stock)>0
            ? 'In stock: '+Number(p.stock)
            : 'Out of stock'}
        </div>
        <button class="btn btn-gold"
          ${Number(p.stock)<=0?'disabled':''}>
          Add to Cart
        </button>
      </div>`;

    const imageBox = card.querySelector('.product-image');
    const img = document.createElement('img');

    // Use the product's own image first.
    // If it is missing, use the category image.
    img.src = p.image_url || categoryImage(p.category);
    img.alt = p.name || 'Product image';
    img.loading = 'lazy';

    img.onerror = function() {
      const fallback = categoryImage(p.category);

      if (fallback && img.src !== fallback && !img.dataset.fallbackUsed) {
        img.dataset.fallbackUsed = 'true';
        img.src = fallback;
      } else {
        imageBox.textContent = '📦';
      }
    };

    if (img.src) {
      imageBox.appendChild(img);
    } else {
      imageBox.textContent = '📦';
    }

    card.querySelector('button').addEventListener('click', () => {
      addToCart(p.id);
    });

    grid.appendChild(card);
  });
}

function saveCart() {
  localStorage.setItem('babaCart',JSON.stringify(cart));
  renderCart();
}

function addToCart(id) {
  const product = products.find(p => String(p.id) === String(id));

  if (!product || Number(product.stock) <= 0) {
    return alert('This product is currently out of stock.');
  }

  const existing = cart.find(item => String(item.id) === String(id));

  if (existing) {
    if (existing.quantity >= Number(product.stock)) {
      return alert('You have reached the available stock quantity.');
    }
    existing.quantity++;
  } else {
    cart.push({id:product.id,quantity:1});
  }

  saveCart();
  alert('Product added to your cart!');
}

function renderCart() {
  const container = document.getElementById('cartItems');
  let total = 0;
  let count = 0;

  container.innerHTML = '';

  cart = cart.filter(item =>
    products.some(p => String(p.id) === String(item.id))
  );

  cart.forEach(item => {
    const p = products.find(product =>
      String(product.id) === String(item.id)
    );

    if (!p) return;

    const quantity = Math.min(
      Number(item.quantity),
      Number(p.stock)
    );

    item.quantity = quantity;

    if (quantity <= 0) return;

    total += Number(p.price) * quantity;
    count += quantity;

    const row = document.createElement('div');
    row.className = 'cart-item';

    row.innerHTML = `
      <div>
        <strong>${escapeHTML(p.name)}</strong>
        <small>${money(p.price)} each</small>
        <small>Quantity: ${quantity}</small>
      </div>
      <div>
        <button class="close" aria-label="Decrease quantity">−</button>
        <button class="close" aria-label="Increase quantity">+</button>
        <button class="close" aria-label="Remove item">✕</button>
      </div>`;

    const buttons = row.querySelectorAll('button');
    buttons[0].onclick = () => changeQuantity(p.id,-1);
    buttons[1].onclick = () => changeQuantity(p.id,1);
    buttons[2].onclick = () => removeFromCart(p.id);

    container.appendChild(row);
  });

  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = money(total);

  if (!cart.length) {
    container.innerHTML = '<p>Your cart is empty.</p>';
  }

  localStorage.setItem('babaCart',JSON.stringify(cart));
}

function changeQuantity(id,amount) {
  const item = cart.find(i => String(i.id) === String(id));
  const product = products.find(p => String(p.id) === String(id));

  if (!item || !product) return;

  const next = item.quantity + amount;

  if (next > Number(product.stock)) {
    return alert('Not enough stock available.');
  }

  if (next <= 0) return removeFromCart(id);

  item.quantity = next;
  saveCart();
}

function removeFromCart(id) {
  cart = cart.filter(i => String(i.id) !== String(id));
  saveCart();
}

window.openCart = function() {
  document.getElementById('overlay').classList.add('show');
  document.getElementById('cartDrawer').classList.add('show');
};

window.closeCart = function() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('cartDrawer').classList.remove('show');
};

window.checkout = function() {
  if (!cart.length) return alert('Your cart is empty.');

  let message = "Hello BABA'S QUINCALLERIE! I would like to order:\n\n";
  let total = 0;

  cart.forEach(item => {
    const p = products.find(product =>
      String(product.id) === String(item.id)
    );

    if (!p) return;

    message += `${p.name} x ${item.quantity} = ${money(Number(p.price)*item.quantity)}\n`;
    total += Number(p.price) * item.quantity;
  });

  message += `\nEstimated total: ${money(total)}\n\nPlease confirm availability.`;

  window.open(
    'https://wa.me/250796000275?text=' + encodeURIComponent(message),
    '_blank'
  );
};

async function verifyAdmin(user) {
  if (!user) return false;

  const {data,error} = await supabase
    .from('user_roles')
    .select('role')
    .eq('user_id',user.id)
    .maybeSingle();

  if (error || data?.role !== 'admin') {
    console.error('Administrator role verification failed:',error);
    return false;
  }

  currentAdmin = user;
  return true;
}

window.login = async function(event) {
  event.preventDefault();

  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value;
  const message = document.getElementById('loginError');
  const button = document.getElementById('loginButton');

  message.textContent = '';
  button.disabled = true;
  button.textContent = 'Signing in...';

  const {data,error} = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.textContent = 'Login failed. Check your email and password.';
    button.disabled = false;
    button.textContent = 'Login';
    return;
  }

  const allowed = await verifyAdmin(data.user);

  if (!allowed) {
    await supabase.auth.signOut();
    currentAdmin = null;
    message.textContent =
      'This account does not have administrator permission.';
    button.disabled = false;
    button.textContent = 'Login';
    return;
  }

  document.getElementById('loginArea').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  document.getElementById('adminPassword').value = '';

  renderAdminProducts();

  button.disabled = false;
  button.textContent = 'Login';
};

window.logout = async function() {
  await supabase.auth.signOut();
  currentAdmin = null;

  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('loginArea').classList.remove('hidden');
};

window.addProduct = async function(event) {
  event.preventDefault();

  if (!currentAdmin) {
    return alert('Please log in as an administrator.');
  }

  const product = {
    name:document.getElementById('productName').value.trim(),
    category:document.getElementById('productCategory').value,
    price:Number(document.getElementById('productPrice').value),
    stock:Number(document.getElementById('productStock').value),
    image_url:document.getElementById('productImage').value.trim() || null,
    description:document.getElementById('productDescription').value.trim()
  };

  if (!product.name || product.price < 0 || product.stock < 0) {
    return alert('Please enter valid product details.');
  }

  const {error} = await supabase
    .from('products')
    .insert(product);

  if (error) {
    console.error(error);
    document.getElementById('adminMessage').textContent =
      'Could not add product: ' + error.message;
    document.getElementById('adminMessage').className = 'error';
    return;
  }

  document.getElementById('adminMessage').textContent =
    'Product added successfully!';
  document.getElementById('adminMessage').className = 'success';

  event.target.reset();
  await loadProducts();
};

function renderAdminProducts() {
  const container = document.getElementById('adminProductList');
  container.innerHTML = '';

  if (!products.length) {
    container.textContent = 'No products have been added yet.';
    return;
  }

  products.forEach(p => {
    const row = document.createElement('div');
    row.className = 'admin-row';

    row.innerHTML = `
      <div style="min-width:140px;flex:1">
        <strong>${escapeHTML(p.name)}</strong><br>
        <small>${escapeHTML(p.category || '')}</small>
      </div>
      <label>
        Price
        <input type="number" min="0" step="1"
          value="${Number(p.price)}" class="edit-price">
      </label>
      <label>
        Stock
        <input type="number" min="0" step="1"
          value="${Number(p.stock)}" class="edit-stock">
      </label>
      <button class="btn btn-dark save-button">Save</button>
      <button class="btn" style="background:#ffe1e1;color:#a00">
        Delete
      </button>`;

    const inputs = row.querySelectorAll('input');

    row.querySelector('.save-button').onclick = () => {
      updateProduct(p.id,inputs[0].value,inputs[1].value);
    };

    row.querySelectorAll('button')[1].onclick = () => {
      deleteProduct(p.id,p.name);
    };

    container.appendChild(row);
  });
}

async function updateProduct(id,price,stock) {
  if (!currentAdmin) {
    return alert('Administrator login required.');
  }

  if (price === '' || stock === '' ||
      Number(price) < 0 || Number(stock) < 0) {
    return alert('Enter valid price and stock values.');
  }

  const {error} = await supabase
    .from('products')
    .update({
      price:Number(price),
      stock:Number(stock)
    })
    .eq('id',id);

  if (error) return alert('Update failed: ' + error.message);

  alert('Product updated successfully.');
  await loadProducts();
}

async function deleteProduct(id,name) {
  if (!currentAdmin) {
    return alert('Administrator login required.');
  }

  if (!confirm(`Delete "${name}" from your catalogue?`)) return;

  const {error} = await supabase
    .from('products')
    .delete()
    .eq('id',id);

  if (error) return alert('Delete failed: ' + error.message);

  cart = cart.filter(item => String(item.id) !== String(id));
  saveCart();

  await loadProducts();
}

window.openAdmin = function() {
  const section = document.getElementById('adminSection');
  section.classList.add('show');
  section.scrollIntoView({behavior:'smooth'});
};

async function start() {
  buildCategories();

  // Load products before rendering the saved cart.
  // This prevents saved cart items from being cleared on refresh.
  const loaded = await loadProducts();

  if (loaded) {
    renderCart();
  }

  const {data} = await supabase.auth.getSession();

  if (data.session?.user) {
    const allowed = await verifyAdmin(data.session.user);

    if (allowed) {
      document.getElementById('loginArea').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      renderAdminProducts();
    } else {
      await supabase.auth.signOut();
    }
  }

  supabase.auth.onAuthStateChange((event,session) => {
    if (event === 'SIGNED_OUT') {
      currentAdmin = null;
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('loginArea').classList.remove('hidden');
    }
  });
}

start();
</script>
